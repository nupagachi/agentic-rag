# Dev trên 1 máy, chạy chồng lên docker-compose.yml:
#   cp .env.example .env
#   docker compose -f docker-compose.yml -f docker-compose.dev.yaml up -d
#
# Khác docker-compose.yml:
# - project riêng (agentic-rag-dev): container và volume tách khỏi bản chính
# - cổng luôn chỉ mở trên 127.0.0.1
# - Postgres ít RAM, ghi log mọi câu SQL để debug
# - Qdrant ghi log mức DEBUG
name: agentic-rag-dev

services:
  postgres:
    command:
      - postgres
      - -c
      - max_connections=100
      - -c
      - shared_buffers=128MB
      - -c
      - log_statement=all
    ports: !override ["127.0.0.1:5432:5432"]

  redis:
    ports: !override ["127.0.0.1:6379:6379"]

  qdrant:
    environment:
      QDRANT__LOG_LEVEL: DEBUG
    ports: !override
      - "127.0.0.1:6333:6333"   # REST
      - "127.0.0.1:6334:6334"   # gRPC

  minio:
    ports: !override
      - "127.0.0.1:9000:9000"   # S3 API
      - "127.0.0.1:9001:9001"   # console
