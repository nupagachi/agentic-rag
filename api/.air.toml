# air (hot reload) config. Started by `make dev` (see Makefile), which loads ../.env first.
root = "."
tmp_dir = "tmp"

# The .exe suffix is required by air on Windows and harmless elsewhere.
[build]
  cmd = "go build -o ./tmp/app.exe ./cmd/app"
  bin = "./tmp/app.exe"
  args_bin = ["api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "testdata", "vendor"]
  exclude_regex = ["_test\\.go$"]
  # Rebuild quickly after a save (AC10: <= 5s end to end).
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "5s"

[log]
  time = false
  main_only = false

[misc]
  clean_on_exit = true
