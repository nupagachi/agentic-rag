[project]
name = "rag-worker"
version = "0.1.0"
description = "Agentic RAG Python worker (crawl, parse, chunk, embed)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pip-audit>=2.7",
    "pytest>=8.3",
    "ruff>=0.8",
    "watchfiles>=1.0",
]

[build-system]
requires = ["uv_build>=0.12,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag_worker"
module-root = ""

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# S = flake8-bandit (SR-19)
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = ["error"]
markers = [
    "integration: needs real services (Docker/testcontainers); excluded from `make check`",
]
