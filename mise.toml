# Toolchain của monorepo. Mọi phiên bản pin CHÍNH XÁC (SR-16), không dùng latest.
# Cài: `mise install`. Không có mise thì cài tay đúng các phiên bản dưới đây (xem README).
# Nâng phiên bản = sửa file này trong PR riêng, kèm chạy `make check` và `make sec`.

[tools]
go = "1.27.2"
node = "22.23.3"
python = "3.12.15"
uv = "0.13.0"

# Công cụ quét và lint (cài qua mise, không dùng `curl | sh`)
gitleaks = "8.30.1"
golangci-lint = "2.14.0"
"go:golang.org/x/vuln/cmd/govulncheck" = "1.9.0"
"go:github.com/air-verse/air" = "1.67.4"
