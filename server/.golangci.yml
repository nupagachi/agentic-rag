# golangci-lint v2: cd server && golangci-lint run ./...
version: "2"

linters:
  enable:
    - bodyclose    # quên đóng resp.Body
    - errorlint    # so sánh lỗi bằng errors.Is/As thay vì == hoặc type assert
    - noctx        # HTTP request/DB query không có context
    - nilerr       # trả nil dù err != nil
    - rowserrcheck # quên kiểm rows.Err()
    - sqlclosecheck
    - unconvert
    - gocritic
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go
        linters: [noctx, bodyclose]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/nhucanh/agentic-rag/server
